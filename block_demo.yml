- name: Changed When usecase - run handlers forcefully
  hosts: servera*
  gather_facts: true
  become: true
  remote_user: devops
  tasks:
    - name: "Outside Block - Task 1 {{ inventory_hostname }}"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} == {{ floor }}"

    - name: Block of Web Tasks
      block:
        - name: Open Firewall Web Port
          ansible.posix.firewalld:
            service: http
            state: enabled
            permanent: true
            immediate: true

        - name: Install Package
          ansible.builtin.dnf:
            name: httpd
            state: present

        - name: Deploy Web Page
          ansible.builtin.copy:
            content: 'First Index Page'
            dest: /var/www/html/index.html
            mode: "0644"

        - name: Start Web Service
          ansible.builtin.systemd_service:
            name: httpd
            state: started
            enabled: true
      when: ansible_facts['architecture'] == "x86_64"
      rescue:

        - name: Last Known Good Config
          ansible.builtin.debug:
            msg: "MayDay Mayday Undo Everything"

        - name: Close Firewall Web Port
          ansible.posix.firewalld:
            service: http
            state: disabled
            permanent: true
            immediate: true

        - name: Undeploy App
          ansible.builtin.copy:
            content: 'First Index Page'
            dest: /var/www/html/index.html
            mode: "0644"

        - name: Remove Package
          ansible.builtin.dnf:
            name: httpd
            state: absent
            autoremove: true

      always:
        - name: Inforem Client abot status
          ansible.builtin.debug:
            msg: "Email Sent"

    - name: "Outside Block - Task 2 {{ inventory_hostname }}"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} == {{ floor }}"
