- name: Debug Strategy
  hosts: servera*
  gather_facts: false
  become: true
  remote_user: devops
  strategy: ansible.builtin.debug
  tasks:
    - name: Task 1
      ansible.builtin.command: sleep 2
      register: captured

    - name: Task 20
      ansible.builtin.debug:
        msg: "Task 20"

    - name: Install Package Task 21
      ansible.builtin.dnf:
        name: httpdddd
        state: present
    # task.args
    # task.args['name']='httpd'
    # task.args
    # redo

    - name: Deploy Web Page Task 22
      ansible.builtin.copy:
        content: 'First Index Page {{ captured.changed }}'
        dest: /var/wwww/html/index.html
        mode: "0644"
    # task.args
    # task.args['dest']='/var/www/html/index.html'
    # task.args
    # redo

    - name: Start Web Service
      ansible.builtin.systemd_service:
        name: httpddddd
        stateeeee: started
        enabled: true
    # task.args
    # task.args['name']='httpd'
    # task.args['state']='started'
    # del(task.args['stateeeee'])
    # task.args
    # redo

    - name: Open Firewall Web Port
      ansible.posix.firewalld:
        service: httpppppp
        state: enabled
        permanentttt: true
        immediate: true
