- name: Best Practises
  hosts: servera*
  gather_facts: false
  tasks:
    - name: Install the packages Good Way
      ansible.builtin.dnf:
        name:
          - httpd
          - vsftpd
        state: present

    # - name: Install the packages Bad Way
    #   ansible.builtin.dnf:
    #     name: "{{ item }}"
    #     state: present
    #   loop:
    #     - httpd
    #     - vsftpd

    # - name: Start Services WILL NOT WORK
    #   ansible.builtin.systemd_service:
    #     name:
    #       - httpd
    #       - vsftpd
    #     state: started
    #     enabled: true

    - name: Start Services Only Way
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - httpd
        - vsftpd
