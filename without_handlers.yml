- name: Dependency Tasks Register without Handlers
  hosts: servera*
  gather_facts: false
  become: true
  remote_user: devops
  tasks:

    - name: Install Package
      ansible.builtin.dnf:
        name: httpd
        state: present
      register: captured

    - name: Print Output
      ansible.builtin.debug:
        msg: "{{ captured }}"


    - name: Start Web Service
      ansible.builtin.systemd_service:
        name: httpd
        state: started
        enabled: true
      when: captured.changed
      # when: captured.changed == true
