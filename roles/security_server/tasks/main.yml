---
# tasks file for security_server

    - name: Install Security Package
      ansible.builtin.dnf:
        name: "{{ security_server_package }}"
        state: present
      notify:
        - Security Package Installed
        - Restart Firewalld Service

    - name: Open Firewall Web Port
      ansible.posix.firewalld:
        service: "{{ security_server_port }}"
        state: "{{ security_server_state }}"
        permanent: "{{ security_server_permanent }}"
        immediate: "{{ security_server_immediate }}"
      notify:
        - Inform Client about Security
        - Restart Firewalld Service
