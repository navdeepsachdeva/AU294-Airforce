---
# tasks file for web_server

- name: Install Package
  ansible.builtin.dnf:
    name: "{{ web_server_package }}"
    state: present
  notify:
    - Package Installed
    - Restart Web Service

- name: Deploy Web Page
  ansible.builtin.copy:
    content: '{{ web_server_content }}'
    dest: "{{ web_server_webpath }}/{{ web_server_index }}"
    mode: "0644"
  notify:
    - Restart Web Service
    - App Deployed
